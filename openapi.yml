components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Lat:
      name: lat
      in: query
      required: true
      schema:
        type: number
        format: double
    Lng:
      name: lng
      in: query
      required: true
      schema:
        type: number
        format: double
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 50
    Kategori:
      name: kategori
      in: query
      required: false
      schema:
        type: string
        enum: [pre_travel, post_travel]
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user does not have the required role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Request was syntactically valid but failed domain validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoContent:
      description: Resource deleted.
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        detail:
          type: string
    UserSummary:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
    GoogleLoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
        device_info:
          type: string
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_info:
          type: string
    BootstrapRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
        device_info:
          type: string
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenRefreshResponse:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          example: 900
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/TokenRefreshResponse"
        - type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/UserSummary"

    LocationClassification:
      type: object
      required: [in_bali, latitude, longitude]
      properties:
        in_bali:
          type: boolean
        region:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    Facility:
      type: object
      required: [id, destination_id, nama, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        destination_id:
          type: integer
          format: int64
        nama:
          type: string
        kategori:
          type: string
          nullable: true
        alamat:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        kontak:
          type: string
          nullable: true
        jam_operasional:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FacilityNearby:
      allOf:
        - $ref: "#/components/schemas/Facility"
        - type: object
          required: [distance_km]
          properties:
            distance_km:
              type: number
              format: double
    FacilityRequest:
      type: object
      required: [destination_id, nama]
      properties:
        destination_id:
          type: integer
          format: int64
        nama:
          type: string
        kategori:
          type: string
          nullable: true
        alamat:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        kontak:
          type: string
          nullable: true
        jam_operasional:
          type: string
          nullable: true
    Destination:
      type: object
      required: [id, nama_daerah, created_at]
      properties:
        id:
          type: integer
          format: int64
        nama_daerah:
          type: string
        created_at:
          type: string
          format: date-time
    DestinationRequest:
      type: object
      required: [nama_daerah]
      properties:
        nama_daerah:
          type: string
    HealthRisk:
      type: object
      required: [id, destination_id, nama_risiko, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        destination_id:
          type: integer
          format: int64
        nama_risiko:
          type: string
        saran_pencegahan:
          type: string
          nullable: true
        rekomendasi_vaksinasi:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HealthRiskRequest:
      type: object
      required: [destination_id, nama_risiko]
      properties:
        destination_id:
          type: integer
          format: int64
        nama_risiko:
          type: string
        saran_pencegahan:
          type: string
          nullable: true
        rekomendasi_vaksinasi:
          type: string
          nullable: true
    EmergencyGuide:
      type: object
      required: [id, kategori, langkah, isi_media, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        kategori:
          type: string
        langkah:
          type: integer
        isi_media:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EmergencyGuideRequest:
      type: object
      required: [kategori, langkah, isi_media]
      properties:
        kategori:
          type: string
        langkah:
          type: integer
        isi_media:
          type: object
          additionalProperties: true
    GuideChoice:
      type: object
      required: [label, variant]
      properties:
        label:
          type: string
        next_id:
          type: string
          nullable: true
        variant:
          type: string
          enum: [yes, no, neutral]
    GuideNode:
      type: object
      required: [id, title, instruction, image_url, is_entry, choices]
      properties:
        id:
          type: string
        title:
          type: string
        instruction:
          type: string
        image_url:
          type: string
        is_entry:
          type: boolean
        choices:
          type: array
          items:
            $ref: "#/components/schemas/GuideChoice"
    EmergencyGuideFlowSummary:
      type: object
      required: [id, title, kategori, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        kategori:
          type: string
        deskripsi:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EmergencyGuideFlow:
      allOf:
        - $ref: "#/components/schemas/EmergencyGuideFlowSummary"
        - type: object
          required: [nodes]
          properties:
            nodes:
              type: array
              items:
                $ref: "#/components/schemas/GuideNode"
    EmergencyGuideFlowRequest:
      type: object
      required: [title, kategori]
      properties:
        title:
          type: string
        kategori:
          type: string
        deskripsi:
          type: string
          nullable: true
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GuideNode"

    HealthProfile:
      type: object
      required: [id, user_id, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        tanggal_lahir:
          type: string
          format: date-time
          nullable: true
        jenis_kelamin:
          type: string
          nullable: true
        tinggi_cm:
          type: number
          format: double
          nullable: true
        berat_kg:
          type: number
          format: double
          nullable: true
        golongan_darah:
          type: string
          nullable: true
        riwayat_alergi:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HealthProfileRequest:
      type: object
      properties:
        tanggal_lahir:
          type: string
          format: date
          nullable: true
        jenis_kelamin:
          type: string
          nullable: true
        tinggi_cm:
          type: number
          format: double
          nullable: true
        berat_kg:
          type: number
          format: double
          nullable: true
        golongan_darah:
          type: string
          nullable: true
        riwayat_alergi:
          type: string
          nullable: true
