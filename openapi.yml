openapi: 3.0.3
info:
  title: BaliTravelHealth Gateway API
  version: 1.0.0
  description: OpenAPI schema for the Go API gateway endpoints in this repository.
servers:
  - url: http://localhost:8080
    description: Local Go API gateway
tags:
  - name: System
  - name: Auth
  - name: Public
  - name: Traveler
  - name: Nursing
  - name: Admin
  - name: Expert Admin
paths:
  /health:
    get:
      tags: [System]
      summary: Check gateway and database health.
      responses:
        "200":
          description: Gateway is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /uploads/{path}:
    get:
      tags: [System]
      summary: Get an uploaded static file.
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Uploaded file bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /auth/google:
    post:
      tags: [Auth]
      summary: Authenticate a traveler with a Google ID token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: Token pair and user summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token and issue a new access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logout confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate an admin or nurse with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Token pair and user summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/bootstrap:
    post:
      tags: [Auth]
      summary: Create the first admin account when no admin exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: Admin account created and token pair issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /location/classify:
    get:
      tags: [Public]
      summary: Classify whether coordinates are inside Bali and approximate the region.
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
      responses:
        "200":
          description: Location classification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationClassification"
        "400":
          $ref: "#/components/responses/BadRequest"
  /facilities/nearby:
    get:
      tags: [Public]
      summary: List nearby medical facilities.
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
        - name: radius_km
          in: query
          required: false
          schema:
            type: number
            format: double
            default: 20
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        "200":
          description: Nearby facilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityNearbyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /destinations:
    get:
      tags: [Public]
      summary: List Bali destinations or regions.
      responses:
        "200":
          description: Destination list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationListResponse"
  /destinations/{id}/health-risks:
    get:
      tags: [Public]
      summary: List health risks for a destination.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Health risk list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRiskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /emergency-guides:
    get:
      tags: [Public]
      summary: List step-based emergency guides.
      parameters:
        - name: kategori
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Emergency guide list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyGuideListResponse"
  /emergency-guide-flows:
    get:
      tags: [Public]
      summary: List decision-tree emergency guide summaries.
      responses:
        "200":
          description: Emergency guide flow summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyGuideFlowSummaryListResponse"
  /emergency-guide-flows/{id}:
    get:
      tags: [Public]
      summary: Get one decision-tree emergency guide.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Emergency guide flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyGuideFlow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /expert/symptoms:
    get:
      tags: [Public]
      summary: List public symptoms, optionally scoped to a diagnosis category.
      parameters:
        - $ref: "#/components/parameters/Kategori"
      responses:
        "200":
          description: Symptom list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSymptomListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /health-profile:
    get:
      tags: [Traveler]
      summary: Get the authenticated user's health profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Health profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Traveler]
      summary: Create the authenticated user's health profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthProfileRequest"
      responses:
        "201":
          description: Health profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      tags: [Traveler]
      summary: Update the authenticated user's health profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthProfileRequest"
      responses:
        "200":
          description: Updated health profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /traveler-profile:
    get:
      tags: [Traveler]
      summary: Get the authenticated user's traveler profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Traveler profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Traveler"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Traveler]
      summary: Create the authenticated user's traveler profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelerRequest"
      responses:
        "201":
          description: Traveler profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Traveler"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      tags: [Traveler]
      summary: Update the authenticated user's traveler profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelerRequest"
      responses:
        "200":
          description: Updated traveler profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Traveler"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /assessment:
    post:
      tags: [Traveler]
      summary: Submit symptoms and run diagnosis.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentRequest"
      responses:
        "201":
          description: Stored health assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAssessment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /assessments:
    get:
      tags: [Traveler]
      summary: List the authenticated user's assessment history.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Assessment page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /vaccinations:
    get:
      tags: [Traveler]
      summary: List vaccination records.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Vaccination record list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaccinationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Traveler]
      summary: Create a vaccination record.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaccinationRequest"
      responses:
        "201":
          description: Vaccination record created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaccinationRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /vaccinations/{id}:
    delete:
      tags: [Traveler]
      summary: Delete a vaccination record.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Delete confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /nurses:
    get:
      tags: [Nursing]
      summary: List active nurses.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active nurse list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NurseListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /nursing/appointments:
    post:
      tags: [Nursing]
      summary: Create a nursing appointment.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRequest"
      responses:
        "201":
          description: Nursing care record created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NursingCareRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /nursing/my-records:
    get:
      tags: [Nursing]
      summary: List nursing records for the authenticated traveler.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Traveler nursing records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NursingRecordListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /nursing/nurse-records:
    get:
      tags: [Nursing]
      summary: List records assigned to the logged-in nurse.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Nurse-assigned records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NursingRecordListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /nursing/records/{id}:
    put:
      tags: [Nursing]
      summary: Update a nursing care record assigned to the logged-in nurse.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareRecordRequest"
      responses:
        "200":
          description: Updated nursing care record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NursingCareRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/upload:
    post:
      tags: [Admin]
      summary: Upload an image and receive a public uploads URL.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/facilities:
    get:
      tags: [Admin]
      summary: List all medical facilities.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Facility list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin]
      summary: Create a medical facility.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityRequest"
      responses:
        "201":
          description: Facility created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/facilities/{id}:
    put:
      tags: [Admin]
      summary: Update a medical facility.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityRequest"
      responses:
        "200":
          description: Updated facility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete a medical facility.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/destinations:
    post:
      tags: [Admin]
      summary: Create a destination.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationRequest"
      responses:
        "201":
          description: Destination created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/destinations/{id}:
    put:
      tags: [Admin]
      summary: Update a destination.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationRequest"
      responses:
        "200":
          description: Updated destination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete a destination.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/health-risks:
    post:
      tags: [Admin]
      summary: Create a health risk.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRiskRequest"
      responses:
        "201":
          description: Health risk created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRisk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/health-risks/{id}:
    put:
      tags: [Admin]
      summary: Update a health risk.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRiskRequest"
      responses:
        "200":
          description: Updated health risk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRisk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete a health risk.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/emergency-guides:
    post:
      tags: [Admin]
      summary: Create a step-based emergency guide.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyGuideRequest"
      responses:
        "201":
          description: Emergency guide created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyGuide"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/emergency-guides/{id}:
    put:
      tags: [Admin]
      summary: Update a step-based emergency guide.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyGuideRequest"
      responses:
        "200":
          description: Updated emergency guide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyGuide"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete a step-based emergency guide.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
